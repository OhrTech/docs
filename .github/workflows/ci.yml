name: CI

# Cloudflare Pages builds and deploys the site itself; this checks that it builds, that its links
# work, and that every C# example and snippet compiles against the published SDK.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: The reference matches the API's OpenAPI document
        run: |
          node scripts/sync-openapi.mjs
          git diff --exit-code -- public/management-api/openapi.json examples/reference-samples.cs

      - name: Every example and page snippet compiles
        run: |
          node scripts/check-snippets.mjs
          for f in examples/*.cs examples/.page-snippets.cs; do
            echo "::group::$f"
            dotnet build "$f"
            echo "::endgroup::"
          done

  device-snippets:
    # The Device SDK pages' app code: Kotlin and Java, Dart, TypeScript and C#, against the published SDKs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install android
      - name: React Native's types
        run: npm install --no-save --no-audit --no-fund
        working-directory: examples/device/rn
      - run: scripts/check-device-snippets.sh
